name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precommit:
    name: Precommit / native=${{ matrix.native }}
    strategy:
      fail-fast: false
      matrix:
        native: [false, true]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OBSCURA_EFFICIENT_TEST: ${{ matrix.native && '1' || '0' }}
      MIX_ENV: test
      MIX_HOME: ${{ github.workspace }}/.mix
      HEX_HOME: ${{ github.workspace }}/.hex
      OBSCURA_EXAMPLES_EMILY: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: 29.0.3
          elixir-version: 1.20.2

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            .mix
            .hex
          key: precommit-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.exs', 'mix.lock') }}
          restore-keys: |
            precommit-${{ runner.os }}-

      - name: Install local Mix tools
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: matrix.native
        with:
          version: '0.12.1'

      - name: Provision the published efficient assets
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libopenblas0-pthread libpcre2-8-0
          mix compile --warnings-as-errors
          mix obscura.efficient.install --allow-download

      - name: Run precommit validation
        run: mix precommit
